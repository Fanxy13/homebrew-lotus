<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commands — Lotus</title>
  <meta name="description" content="Every Lotus command with a short description and an example.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lotus.css?v=2.6.0">
  <link rel="stylesheet" href="css/pages.css?v=2.6.0">
  <script src="js/lotus.js?v=2.6.0"></script>
</head>
<body>
  <lotus-nav></lotus-nav>
  <main class="wrap">
    <header class="page-head">
      <p class="eyebrow">Cheatsheet</p>
      <h1>Every <span>command</span></h1>
      <p class="lead">Type them in any terminal window. Typos are fine – Lotus suggests the closest command. In the terminal: <code>/lotus cheatsheet</code></p>
    </header>

    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filter" type="search" placeholder="Search commands, e.g. weather" autocomplete="off">
    </label>
    <div class="chips" id="cats"></div>
    <div id="commands" aria-live="polite"></div>
    <p class="empty muted" hidden>No command matches. Try another word.</p>
  </main>
  <lotus-footer></lotus-footer>
  <script src="js/commands.js?v=2.6.0" defer></script>
</body>
</html>
