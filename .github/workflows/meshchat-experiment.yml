# Temporary (to be removed): what macOS does with a Bluetooth program started from Terminal.app
name: MeshChat experiment

on:
  push:
    branches: [claude/serene-fermat-sbb79f]
    paths: [.github/meshchat-experiment.sh, .github/workflows/meshchat-experiment.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/meshchat-experiment.sh
