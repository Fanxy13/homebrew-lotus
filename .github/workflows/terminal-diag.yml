# (temporary) How a console of Windows PowerShell 5.1 behaves on a GitHub Windows machine under each execution policy.
name: Terminal diag
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: [.github/workflows/terminal-diag.yml, .github/scripts/diag_policy.py]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Each policy, one console (written to the registry from PowerShell 7, as Windows PowerShell cannot change a Restricted policy)
        shell: pwsh
        run: |
          python -m pip install --quiet pyte pywinpty
          $key = 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell'
          "was: $((Get-ItemProperty $key).ExecutionPolicy)"
          function Set-Policy([string]$p) {
            if ($p -eq 'Undefined') { Remove-ItemProperty -Path $key -Name ExecutionPolicy -ErrorAction SilentlyContinue } else { Set-ItemProperty -Path $key -Name ExecutionPolicy -Value $p }
          }
          foreach ($policy in 'Restricted', 'AllSigned', 'Undefined') {
            "`n==================== LocalMachine $policy"
            Set-Policy $policy
            python .github/scripts/diag_policy.py
          }
          "`n==================== Process scope Restricted, machine Undefined"
          python .github/scripts/diag_policy.py -ExecutionPolicy Restricted
          "`n==================== Process scope AllSigned, machine Undefined"
          python .github/scripts/diag_policy.py -ExecutionPolicy AllSigned
