# Lotus for Windows (win/, install.ps1) on real Windows, on every push that changes it – any branch: the Pester tests
# (the module, the contract with the zsh engine, the installer from start to end with lotus.cmd, the PATH and the pinned
# fastfetch, the pets, /ai against a fake AI, Live Server and /html with the runner's Python, /img with ImageMagick, and
# win/tests/Windows.Tests.ps1 – what only Windows has: the apps of the Start menu, keep awake, DPAPI, Windows command
# lines) with PowerShell 7 on x64 and Arm64; the files that Windows PowerShell 5.1 has to read; every winget id of the
# app catalog, asked of winget itself; Remove BG for real: its Python runtime with PyTorch, BiRefNet Lite from Hugging
# Face, and a picture cut out on the processor; a Minecraft server for real: Java from adoptium.net, Paper from PaperMC,
# run in the background until it is ready, with LotusBridge's TPS, a command, and a stop that saves.
name: Lotus for Windows

on:
  push:
    branches: ['**']
    paths: [win/**, install.ps1, bin/lotus.cmd, bin/lotus.ps1, data/**, logos/**, lib/core.zsh, lib/lang/**, lib/live/**, lib/html/**, lib/bg/**, lib/mc/**, tests/contract/**, tests/fake-modrinth.py, .gitattributes, .github/workflows/windows.yml]
  pull_request:
    paths: [win/**, install.ps1, bin/lotus.cmd, bin/lotus.ps1, data/**, logos/**, lib/core.zsh, lib/lang/**, lib/live/**, lib/html/**, lib/bg/**, lib/mc/**, tests/contract/**, tests/fake-modrinth.py, .gitattributes, .github/workflows/windows.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    name: PowerShell 7 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - name: This Windows and its PowerShell
        shell: pwsh
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Host
          [Environment]::OSVersion | Out-String | Write-Host
          "Architecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          "Line ends of a checked-out file: $(if ((Get-Content -Raw data/commands.tsv) -match "`r") { 'CRLF' } else { 'LF' })"
      # /img converts with ImageMagick: with it the tests convert real images (without it they are reported as skipped)
      - name: ImageMagick for /img
        shell: pwsh
        continue-on-error: true
        run: |
          winget install --id ImageMagick.ImageMagick -e --accept-source-agreements --accept-package-agreements --disable-interactivity
          Get-ChildItem (Join-Path $env:ProgramFiles 'ImageMagick-*\magick.exe') | ForEach-Object { & $_.FullName -version | Select-Object -First 1 }
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester
          "Pester $((Get-Module Pester).Version)"
          $c = New-PesterConfiguration
          $c.Run.Path = 'win/tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  bg-real:
    name: Remove BG on real Windows (PyTorch, BiRefNet Lite)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set it up and cut out a picture, the way you would
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'lotus-bg'
          $env:LOTUS_ROOT = $PWD.Path
          $env:LOTUS_CONF = "$tmp\conf"; $env:LOTUS_CACHE = "$tmp\cache"; $env:LOTUS_DATA = "$tmp\data"; $env:LOTUS_STATE = "$tmp\state"
          $show = { Get-Content "$tmp\state\lotus.log" -Tail 80 -ErrorAction SilentlyContinue; Get-Content "$tmp\cache\bg\worker.log" -Tail 40 -ErrorAction SilentlyContinue }
          Import-Module ./win/Lotus.psd1
          lotus settings set LOTUS_CONFIGURED 1 | Out-Null
          lotus settings set LOTUS_LOG_LEVEL debug | Out-Null
          # in a PowerShell of its own, with a limit: when something waits, the logs say where
          $run = {
            param([string]$What, [int]$Seconds)
            $p = Start-Process -FilePath (Get-Process -Id $PID).Path -ArgumentList @('-NoProfile', '-Command', "Import-Module ./win/Lotus.psd1; $What; exit `$LASTEXITCODE") -NoNewWindow -PassThru
            if (-not $p.WaitForExit($Seconds * 1000)) { $p.Kill($true); Write-Host "::error::$What did not finish in $Seconds s"; return 99 }
            $p.ExitCode
          }
          $t0 = Get-Date
          if ((& $run 'lotus bg setup --yes birefnet-lite' 1200) -ne 0) { & $show; exit 1 }
          "set up in $([int]((Get-Date) - $t0).TotalSeconds) s"
          # an orange disc on a grey gradient, made with the runtime's own Pillow
          $py = "$tmp\data\runtime\bg\Scripts\python.exe"
          $img = "$tmp\disc.jpg"
          & $py -c "import sys; from PIL import Image, ImageDraw; im = Image.linear_gradient('L').resize((640, 480)).convert('RGB'); ImageDraw.Draw(im).ellipse((200, 120, 440, 360), fill=(230, 120, 60)); im.save(sys.argv[1], quality=92)" $img
          $t0 = Get-Date
          if ((& $run "lotus bg remove '$img' --out '$tmp\out'" 600) -ne 0) { & $show; exit 1 }
          $out = @(Get-ChildItem "$tmp\out" -Filter '*_no_bg.png' | ForEach-Object FullName)
          if ($out.Count -ne 1) { "output: $out"; & $show; exit 1 }
          "cut out in $([int]((Get-Date) - $t0).TotalSeconds) s: $($out[0])"
          # the disc stays, the gradient goes
          & $py -c "import sys; from PIL import Image; a = Image.open(sys.argv[1]).getchannel('A'); w, h = a.size; c = a.getpixel((w // 2, h // 2)); e = a.getpixel((8, 8)); print('alpha in the disc', c, '- in a corner', e); sys.exit(0 if c > 128 and e < 128 else 1)" $out[0]
          if ($LASTEXITCODE) { & $show; exit 1 }
          lotus doctor --bg

  bg-gpu:
    name: Remove BG for the graphics card on real Windows (the conversion, ONNX Runtime)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Set up both BiRefNets, convert them the way /bg setup does with a card, compare with PyTorch
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'lotus-bggpu'
          $env:LOTUS_ROOT = $PWD.Path
          $env:LOTUS_CONF = "$tmp\conf"; $env:LOTUS_CACHE = "$tmp\cache"; $env:LOTUS_DATA = "$tmp\data"; $env:LOTUS_STATE = "$tmp\state"
          $show = { Get-Content "$tmp\state\lotus.log" -Tail 80 -ErrorAction SilentlyContinue }
          Import-Module ./win/Lotus.psd1
          lotus settings set LOTUS_CONFIGURED 1 | Out-Null
          lotus settings set LOTUS_LOG_LEVEL debug | Out-Null
          $run = {
            param([string]$What, [int]$Seconds)
            $p = Start-Process -FilePath (Get-Process -Id $PID).Path -ArgumentList @('-NoProfile', '-Command', "Import-Module ./win/Lotus.psd1; $What; exit `$LASTEXITCODE") -NoNewWindow -PassThru
            if (-not $p.WaitForExit($Seconds * 1000)) { $p.Kill($true); Write-Host "::error::$What did not finish in $Seconds s"; return 99 }
            $p.ExitCode
          }
          # 1. /bg setup as on any PC without a graphics card (GitHub's has none): nothing for a card is installed
          foreach ($id in 'birefnet-lite', 'birefnet') {
            $t0 = Get-Date
            if ((& $run "lotus bg setup --yes $id" 1500) -ne 0) { & $show; exit 1 }
            "$id set up in $([int]((Get-Date) - $t0).TotalSeconds) s"
          }
          if (Test-Path "$tmp\data\runtime\bg\lotus-gpu") { Write-Host '::error::DirectML was installed on a PC without a graphics card'; exit 1 }
          # 2. what /bg setup adds when there is a card: DirectML, then each model converted on this PC
          $py = "$tmp\data\runtime\bg\Scripts\python.exe"
          & $py -s -E -m pip install --disable-pip-version-check --no-input --progress-bar off -r lib/bg/requirements-windows-gpu.txt
          if ($LASTEXITCODE) { exit 1 }
          $env:LOTUS_LOG = "$tmp\state\lotus.log"; $env:LOTUS_LOG_LEVEL = 'debug'
          foreach ($id in 'birefnet-lite', 'birefnet') {
            $t0 = Get-Date
            $events = @(& $py -s -E -B -X utf8 lib/bg/worker.py prepare --model $id --models-dir "$tmp\data\models")
            $events | ForEach-Object { "  $_" }
            if ($LASTEXITCODE -or -not ($events -match '^done\tprepare\t')) { & $show; exit 1 }
            "$id converted in $([int]((Get-Date) - $t0).TotalSeconds) s"
          }
          # 3. the converted models against PyTorch (on the processor: DirectML refuses Windows' software adapter), and
          #    what Lotus does without a card
          & $py -s -E -B -X utf8 win/tests/bg-gpu-check.py "$tmp\data\models"
          if ($LASTEXITCODE) { & $show; exit 1 }
          lotus doctor --bg

  cover-real:
    name: Album cover on real Windows (a media session, its picture, the drawing)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # a player shows a song with a cover in Windows' media controls; Lotus asks for it, opens the picture with Windows' own
      # image component and draws it (win/tests/cover-real.ps1)
      - name: A player with a song and a cover, and Lotus drawing it
        shell: pwsh
        run: ./win/tests/cover-real.ps1

  mc-real:
    name: Minecraft on real Windows (Temurin, Paper, LotusBridge)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up a Paper server and run it, the way the control center does
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'lotus-mc'
          $env:LOTUS_ROOT = $PWD.Path
          $env:LOTUS_CONF = "$tmp\conf"; $env:LOTUS_CACHE = "$tmp\cache"; $env:LOTUS_DATA = "$tmp\data"; $env:LOTUS_STATE = "$tmp\state"
          $env:LOTUS_MC_HOME = "$tmp\Minecraft"
          Import-Module ./win/Lotus.psd1
          lotus settings set LOTUS_CONFIGURED 1 | Out-Null
          lotus settings set LOTUS_LOG_LEVEL debug | Out-Null
          $ok = & (Get-Module Lotus) {
            Initialize-Lotus
            Import-LotusCommand minecraft
            Import-LotusLangGroup mc
            # the newest release that Paper has a build for
            $manifest = Get-LotusMcJson 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
            $version = $null; $vjson = $null
            foreach ($v in @($manifest.versions | Where-Object { $_.type -eq 'release' } | Select-Object -First 6)) {
              $b = Get-LotusMcJson "https://fill.papermc.io/v3/projects/paper/versions/$($v.id)/builds/latest"
              if ($b -and $b.downloads.'server:default'.url) { $version = $v.id; $vjson = Get-LotusMcJson $v.url; break }
            }
            if (-not $version) { Write-Host '::error::Paper has no build for the newest releases'; return $false }
            $need = [int]$vjson.javaVersion.majorVersion
            Write-Host "Minecraft $version (Paper), Java $need"
            # Java the way Lotus fetches it when there is none: Eclipse Temurin from adoptium.net, its SHA-256 checked
            if (-not (Save-LotusJava $need)) { return $false }
            $javaHome = Join-Path $env:LOTUS_DATA "java\$need"
            if (-not (Test-Path (Join-Path $javaHome 'bin\javac.exe'))) { Write-Host '::error::the JDK has no javac'; return $false }
            Write-Host "Java: $(Get-LotusJavaLabel $javaHome) · Find-LotusJava $($need): $(Find-LotusJava $need)"
            $dir = Join-Path $env:LOTUS_MC_HOME "paper-$version"
            New-LotusDir $dir | Out-Null
            if (-not (Save-LotusMcServerJar $dir 'paper' $version $vjson)) { return $false }
            Write-LotusMcServerFiles $dir 'paper' $version $javaHome '2G' $true 'A Lotus test on Windows' 10 'easy'
            Initialize-LotusMcc $dir
            $m = $script:Mcc
            if (-not (Start-LotusMccServer)) { Write-Host '::error::the runner did not start'; return $false }
            $t0 = Get-Date
            while ($m.State -cne 'running' -and ((Get-Date) - $t0).TotalSeconds -lt 600) {
              Start-Sleep -Seconds 1; Read-LotusMccLog; Update-LotusMccProbe
              if ($m.State -cin 'stopped', 'crashed') { break }
            }
            Write-Host "state after $([int]((Get-Date) - $t0).TotalSeconds) s: $($m.State) (pid $($m.Pid), runner $($m.Wrap))"
            $good = $m.State -ceq 'running'
            if ($good) {
              # LotusBridge: built by the runner with the JDK, its file every two seconds
              for ($i = 0; $i -lt 60 -and -not $m.Bridge; $i++) { Start-Sleep -Seconds 1; Update-LotusMccProbe; Update-LotusMccBridge }
              Write-Host "LotusBridge: $(if ($m.Bridge) { "TPS $($m.Tps), tick $($m.Mspt) ms" } else { 'no status' })"
              if (-not $m.Bridge) { $good = $false; Write-Host '::error::LotusBridge gave no status' }
              [void](Send-LotusMccCommand 'list')
              $seen = $false
              for ($i = 0; $i -lt 30 -and -not $seen; $i++) { Start-Sleep -Seconds 1; Read-LotusMccLog; $seen = [bool]($m.Log | Where-Object { $_ -match 'players online' }) }
              Write-Host "list answered: $seen"
              if (-not $seen) { $good = $false }
              Update-LotusMccSample
              Write-Host "memory $($m.Rss) MB, CPU $($m.Cpu) %, world $([int]($m.WorldKb / 1024)) MB"
            }
            Stop-LotusMccServer
            for ($i = 0; $i -lt 120 -and $m.State -cnotin 'stopped', 'crashed'; $i++) { Start-Sleep -Seconds 1; Read-LotusMccLog; Update-LotusMccProbe }
            Write-Host "after the stop: $($m.State), exit code $($m.Exit)"
            if ($m.State -cne 'stopped' -or $m.Exit -ne 0) { $good = $false }
            Close-LotusMccLog
            Write-Host '--- the end of console.log ---'
            Get-Content (Join-Path $dir '.lotus\console.log') -Tail 40 | ForEach-Object { Write-Host $_ }
            $good
          }
          lotus doctor | Out-Host
          if (-not ($ok | Select-Object -Last 1)) { Get-Content "$tmp\state\lotus.log" -Tail 60; exit 1 }

  powershell51:
    name: Windows PowerShell 5.1 reads every script
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse
        shell: powershell
        run: |
          $bad = 0
          $files = @('install.ps1', 'bin/lotus.ps1') + @(Get-ChildItem win -Recurse -Filter '*.ps1' -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) })
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "$f : $_" }; $bad++ }
          }
          "$($files.Count) files read by Windows PowerShell $($PSVersionTable.PSVersion); $bad with errors"
          if ($bad) { exit 1 }

  pester-51:
    name: Windows PowerShell 5.1 (the one Windows 11 comes with)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Pester, in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Host
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5
          "Pester $((Get-Module Pester).Version)"
          # (Windows PowerShell has no $IsWindows and its kin: the tests ask for them)
          $global:IsWindows = $true; $global:IsLinux = $false; $global:IsMacOS = $false; $global:IsCoreCLR = $false
          $c = New-PesterConfiguration
          $c.Run.Path = 'win/tests'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Normal'
          $r = Invoke-Pester -Configuration $c
          # what failed, in a few lines at the end of the log
          "`n==== RESULT passed=$($r.PassedCount) failed=$($r.FailedCount) skipped=$($r.SkippedCount) total=$($r.TotalCount)"
          foreach ($t in $r.Failed) {
            $m = ($t.ErrorRecord | ForEach-Object { "$($_.Exception.Message)" }) -join ' | ' -replace '\s+', ' '
            "FAILED: $($t.ExpandedPath) :: $($m.Substring(0, [Math]::Min(330, $m.Length)))"
          }
          foreach ($k in $r.Containers | Where-Object { $_.Result -eq 'Failed' -and $_.ErrorRecord }) {
            $m = ($k.ErrorRecord | ForEach-Object { "$($_.Exception.Message)" }) -join ' | ' -replace '\s+', ' '
            "CONTAINER: $(Split-Path -Leaf $k.Item) :: $($m.Substring(0, [Math]::Min(330, $m.Length)))"
          }
          if ($r.FailedCount -or $r.FailedContainersCount) { exit 1 }

  winget-ids:
    name: The winget ids of the app catalog exist
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: winget show --exact for every id of data/apps.tsv
        shell: pwsh
        run: |
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          if (-not $winget) { Write-Host '::error::winget is not on this runner'; exit 1 }
          winget --version
          $header = (Get-Content data/apps.tsv | Where-Object { $_ -like '# name*' } | Select-Object -First 1) -replace '^# ', '' -split "`t"
          $col = [Array]::IndexOf($header, 'winget')
          if ($col -lt 0) { Write-Host 'data/apps.tsv has no winget column yet'; exit 0 }
          $missing = @()
          foreach ($line in Get-Content data/apps.tsv) {
            if ($line -like '#*' -or -not $line) { continue }
            $f = $line -split "`t"
            $id = $f[$col]
            if (-not $id -or $id -eq '-') { continue }
            $out = winget show --id $id --exact --accept-source-agreements --disable-interactivity 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $out -notmatch [regex]::Escape($id)) { $missing += "$($f[0]): $id"; Write-Host "MISSING  $($f[0])  $id" } else { Write-Host "ok       $($f[0])  $id" }
          }
          if ($missing.Count) { Write-Host "::error::winget does not know: $($missing -join '; ')"; exit 1 }
