# Builds and tests MeshChat – part of Lotus (lib/meshchat, lib/cmd/meshchat.zsh) – on a Mac: the Swift program with
# every warning, then through Lotus – built inside MeshChat's sandbox like on your Mac – its protocol tests with
# CryptoKit, the chat in a terminal (the demo) and the old plugin going away with its identity and history. And the same
# bytes as MeshChat for Windows (win/meshchat), both ways: the Mac checks the test vectors the Windows app made, and the
# Windows code checks packets this Mac signed. A CI Mac has no Bluetooth to speak of: what needs several computers is
# tested by hand (lib/meshchat/README.md, "Testing with real Macs").
name: MeshChat

on:
  push:
    paths: [lib/meshchat/**, lib/cmd/meshchat.zsh, lib/platform/macos.zsh, bin/lotus, tests/test-meshchat.zsh, lib/cmd/plugin.zsh, win/meshchat/**, .github/workflows/meshchat.yml]
  pull_request:
    paths: [lib/meshchat/**, lib/cmd/meshchat.zsh, lib/platform/macos.zsh, bin/lotus, tests/test-meshchat.zsh, lib/cmd/plugin.zsh, win/meshchat/**, .github/workflows/meshchat.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Swift
        run: xcrun swiftc --version && sw_vers
      - name: Build the chat with every warning
        run: |
          mkdir -p "$RUNNER_TEMP/mc"
          xcrun swiftc -Onone -parse-as-library -swift-version 5 -target "$(uname -m)-apple-macos11.0" \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker lib/meshchat/Info.plist \
            -o "$RUNNER_TEMP/mc/meshchat" lib/meshchat/Sources/*.swift 2>&1 | tee "$RUNNER_TEMP/mc/build.log"
          test -x "$RUNNER_TEMP/mc/meshchat"
          "$RUNNER_TEMP/mc/meshchat" version
          # an optional delegate method with a wrong signature would compile, and never be called
          ! grep -E "nearly matches|deprecated" "$RUNNER_TEMP/mc/build.log"
      - name: In Apple's Terminal – macOS asks for Bluetooth there, so MeshChat goes ahead
        run: |
          # Terminal's Info.plist declares no Bluetooth use, yet macOS lets it ask (it holds
          # com.apple.private.tcc.allow-prompting). MeshChat 1 refused to start in it. The doctor, run in a Terminal window:
          out="$RUNNER_TEMP/mc/in-terminal.txt"
          cat > "$RUNNER_TEMP/mc/doctor.command" <<EOF
          #!/bin/bash
          LOTUS_MESHCHAT_DATA="$RUNNER_TEMP/mc/data" "$RUNNER_TEMP/mc/meshchat" doctor > "$out" 2>&1
          echo "[done \$?]" >> "$out"
          EOF
          chmod +x "$RUNNER_TEMP/mc/doctor.command"
          open -a Terminal "$RUNNER_TEMP/mc/doctor.command"
          for i in $(seq 90); do grep -q '^\[done' "$out" 2>/dev/null && break; sleep 1; done
          cat "$out"
          grep -q "Terminal – /System/Applications/Utilities/Terminal.app" "$out"
          grep -q "macOS asks Terminal for the Bluetooth permission" "$out"
          ! grep -q "macOS ended\|does not let programs" "$out"
      - name: The same bytes as Windows – the protocol tests, and this Mac's packets written out for the Windows code
        run: |
          src=$(ls lib/meshchat/Sources/*.swift | grep -v '/App.swift$')
          xcrun swiftc -Onone -parse-as-library -swift-version 5 -target "$(uname -m)-apple-macos11.0" \
            -o "$RUNNER_TEMP/mc/tests" $src lib/meshchat/Tests/*.swift
          MESHCHAT_VECTORS_OUT="$RUNNER_TEMP/mc/swift-vectors.txt" "$RUNNER_TEMP/mc/tests" | tee "$RUNNER_TEMP/mc/tests.log"
          grep -q "the same bytes as Windows" "$RUNNER_TEMP/mc/tests.log"
          grep -q " passed, 0 failed" "$RUNNER_TEMP/mc/tests.log"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Packets this Mac signed with CryptoKit open in the Windows code (and its tests pass on a Mac)
        run: |
          dotnet run --project win/meshchat/MeshChat.Tests -c Release -- --verify-foreign "$RUNNER_TEMP/mc/swift-vectors.txt"
          dotnet run --project win/meshchat/MeshChat.Tests -c Release
      - name: MeshChat through Lotus (sandbox build, protocol tests, the chat in a terminal, the old plugin going away)
        run: zsh tests/run.zsh meshchat
      - name: Bluetooth on this runner (for information – a CI Mac usually has none)
        if: always()
        continue-on-error: true
        run: LOTUS_MESHCHAT_DATA="$RUNNER_TEMP/mc/data" "$RUNNER_TEMP/mc/meshchat" doctor || true
