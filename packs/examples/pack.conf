# A Lotus plugin pack: the three example plugins of Lotus at once.
# Install it with: lotus plugin install https://github.com/Fanxy13/homebrew-lotus#packs/examples
# How packs work: PLUGINS.md → Plugin packs

name        = examples
title       = The example plugins
version     = 1.0
author      = Lotus
description = A to-do list for you and the AI, GitHub on the start screen, and Lotus' own look in a plugin
homepage    = https://github.com/Fanxy13/homebrew-lotus/tree/main/plugins

plugin = https://github.com/Fanxy13/homebrew-lotus#plugins/todo
plugin = https://github.com/Fanxy13/homebrew-lotus#plugins/github
plugin = https://github.com/Fanxy13/homebrew-lotus#plugins/hello off     # full access – turn it on with lotus plugin on hello
