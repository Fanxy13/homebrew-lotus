# To-do – an example plugin for Lotus: a command, tools for the AI and a start screen line.
# It runs with limited access: in a sandbox that only sees its own folder, and keeps its list in its data folder.

name        = todo
title       = To-do
version     = 1.0
author      = Lotus
description = A small to-do list in the terminal – the AI in /ai and the web chat can add, list and tick off to-dos too
homepage    = https://github.com/Fanxy13/homebrew-lotus/tree/main/plugins/todo
access      = limited
network     = no

# lotus todo [add <text> | done <number> | list | clear]
command todo = todo.zsh

# Tools for the AI – each runs todo.zsh with a word first, then the values of its parameters
tool add               = todo.zsh add
tool add.label         = To-do
tool add.level         = act
tool add.description   = Add a to-do to the user's list. Use it when the user asks you to remember a task for them.
tool add.param text    = text, required, What there is to do, in a few words

tool list              = todo.zsh list
tool list.label        = To-do
tool list.level        = read
tool list.description  = The user's open to-dos, numbered.

tool done              = todo.zsh done
tool done.label        = To-do
tool done.level        = act
tool done.description  = Tick off one of the user's to-dos by its number from list.
tool done.param number = int(1,999), required, The number of the to-do in list

# Under the start screen: how many are open (made again at most every 60 seconds)
startup       = todo.zsh count
startup.every = 60
