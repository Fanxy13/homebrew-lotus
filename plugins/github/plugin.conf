# GitHub – an example plugin for Lotus in Python, with the internet: it asks GitHub's public API.
# Limited access with network = yes: a sandbox that sees only its own folder, but may use the internet.

name        = github
title       = GitHub
version     = 1.0
author      = Lotus
description = Stars, forks and the newest release of a GitHub repository – and a line of GitHub's zen under the start screen
homepage    = https://github.com/Fanxy13/homebrew-lotus/tree/main/plugins/github
access      = limited
network     = yes

# lotus repo <owner/name>
command repo = github.py repo

tool repo              = github.py repo
tool repo.label        = GitHub
tool repo.level        = read
tool repo.description  = Stars, forks, open issues, the language and the newest release of a public GitHub repository.
tool repo.param name   = text, required, The repository as owner/name, e.g. Fanxy13/homebrew-lotus

startup       = github.py zen
startup.every = 3600
