# Hello – an example plugin for Lotus with full access: it uses Lotus' own functions (its look, its settings).
# Full access means it runs with your rights. Lotus asks you before it installs it, and again after its files change.

name        = hello
title       = Hello
version     = 1.0
author      = Lotus
description = Greets you in Lotus' own look, with your name, your theme and what Lotus has on – an example of full access
homepage    = https://github.com/Fanxy13/homebrew-lotus/tree/main/plugins/hello
access      = full

command hello = hello.zsh
