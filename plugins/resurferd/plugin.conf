# Resurferd – a plugin for Lotus: the Unity game Subway Surfers Resurferd
# (github.com/cyberillcbutsmarter/subway-surfers-resurferd) on this Mac. It takes a ready Mac build from the game's
# GitHub releases, or builds one from the source with the Unity version the project is made with (2019.4), makes it
# run on macOS – executable, out of quarantine, signed for this Mac – and starts it.
# Full access: it runs Unity, which needs your Unity license in ~/Library, and opens the game – a limited plugin
# sees neither. What it makes stays in its data folder (~/.local/share/lotus/plugins/resurferd).

name        = resurferd
title       = Subway Surfers Resurferd
version     = 1.0
author      = Lotus
description = Subway Surfers Resurferd on your Mac – a ready Mac build from GitHub or one built with Unity, made to run on macOS and started
homepage    = https://github.com/Fanxy13/homebrew-lotus/tree/main/plugins/resurferd
access      = full

# lotus surf [play | update | build | install <zip|app> | status | log | remove | help]
command resurferd = resurferd.zsh
command surf      = resurferd.zsh

tool play             = resurferd.zsh tool-play
tool play.label       = Resurferd
tool play.level       = act
tool play.description = Start the game Subway Surfers Resurferd on this Mac. Use it when the user wants to play it. When it is not on this Mac yet, it says how the user gets it.
