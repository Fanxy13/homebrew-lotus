# Live Server – a plugin for Lotus, like Live Server in VS Code: serves the folder you are in on this Mac and
# reloads the page in the browser when you save a file. In Python with nothing but its standard library.
# Full access: it reads the folder you start it in – a limited plugin sees only its own folder – and opens the
# browser. Phones and computers in the same Wi-Fi open it too, nobody from another network (--local: only this
# Mac). It never serves a file outside that folder, nor hidden ones (.git, .env).

name        = liveserver
title       = Live Server
version     = 1.1
author      = Lotus
description = Serves the folder you are in – to this Mac and your Wi-Fi – and reloads the browser when you save
homepage    = https://github.com/Fanxy13/homebrew-lotus/tree/main/plugins/liveserver
access      = full

# lotus liveserver [folder | page.html] [--port <n>] [--no-open] [--local] · lotus liveserver stop
command liveserver = liveserver.py
