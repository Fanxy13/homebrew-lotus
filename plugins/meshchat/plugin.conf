# MeshChat – a Lotus plugin: one chat with everyone nearby over Bluetooth Low Energy, without internet, Wi-Fi or a
# server. Every Mac with MeshChat passes each message on (a mesh), as far as there are Macs to pass it on. Public –
# anyone nearby can read it – and signed, so no one can write in your name. In Swift with Apple's CoreBluetooth and
# CryptoKit, built once on your Mac – it needs the Command Line Tools (xcode-select --install).
# Limited access without internet: it sees only its own folder and keeps its history in its data folder.
# Bluetooth is not the internet: macOS asks whether your terminal app may use it.

name        = meshchat
title       = MeshChat
version     = 2.0
author      = Lotus
description = One chat with everyone nearby over Bluetooth – no internet, no server; every Mac passes messages on, as far as the mesh reaches
homepage    = https://github.com/Fanxy13/homebrew-lotus/tree/main/plugins/meshchat
access      = limited
network     = no

# lotus meshchat [history|nick|set|relay|doctor|demo|selftest|help]
command meshchat = meshchat.zsh
