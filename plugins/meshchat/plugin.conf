# MeshChat – a Lotus plugin: a group chat with Macs nearby over Bluetooth Low Energy, without internet, Wi-Fi or a
# server. Messages hop from Mac to Mac (a mesh), encrypted with the room's key. In Swift with Apple's CoreBluetooth
# and CryptoKit, built once on your Mac – it needs the Command Line Tools (xcode-select --install).
# Limited access without internet: it sees only its own folder and keeps rooms and history in its data folder.
# Bluetooth is not the internet: macOS asks whether your terminal app may use it.

name        = meshchat
title       = MeshChat
version     = 1.0
author      = Lotus
description = A group chat with Macs nearby over Bluetooth – no internet, no server; messages hop from Mac to Mac, encrypted for the room
homepage    = https://github.com/Fanxy13/homebrew-lotus/tree/main/plugins/meshchat
access      = limited
network     = no

# lotus meshchat [create|join|rooms|open|invite|leave|history|nick|set|relay|doctor|demo|selftest|help]
command meshchat = meshchat.zsh
