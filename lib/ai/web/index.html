<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="lotus-token" content="{{token}}">
  <meta name="color-scheme" content="dark">
  <title>Lotus AI</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css?v={{version}}">
  <script src="/app.js?v={{version}}" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Conversations">
      <div class="side-head">
        <img src="/icon.svg" alt="" width="22" height="22">
        <span class="brand">Lotus AI</span>
      </div>
      <button class="new" id="new" type="button">New chat</button>
      <nav class="chats" id="chats"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="top">
        <button class="icon-btn menu" id="menu" type="button" aria-label="Conversations">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="top-text">
          <h1 id="title">New chat</h1>
          <p class="meta" id="meta">Connecting …</p>
        </div>
        <button class="icon-btn" id="open-settings" type="button" aria-label="Settings" title="Settings (/settings)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10.16 4.63L10.49 1.91L13.51 1.91L13.84 4.63A7.6 7.6 0 0 1 15.91 5.49L18.07 3.80L20.20 5.93L18.51 8.09A7.6 7.6 0 0 1 19.37 10.16L22.09 10.49L22.09 13.51L19.37 13.84A7.6 7.6 0 0 1 18.51 15.91L20.20 18.07L18.07 20.20L15.91 18.51A7.6 7.6 0 0 1 13.84 19.37L13.51 22.09L10.49 22.09L10.16 19.37A7.6 7.6 0 0 1 8.09 18.51L5.93 20.20L3.80 18.07L5.49 15.91A7.6 7.6 0 0 1 4.63 13.84L1.91 13.51L1.91 10.49L4.63 10.16A7.6 7.6 0 0 1 5.49 8.09L3.80 5.93L5.93 3.80L8.09 5.49A7.6 7.6 0 0 1 10.16 4.63Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
        </button>
        <button class="icon-btn" id="clear" type="button" aria-label="Clear this conversation" title="Clear this conversation" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div class="banner" id="banner" hidden>
        <span id="banner-text"></span>
        <button type="button" id="banner-retry">Try again</button>
      </div>

      <section class="log" id="log" aria-live="polite">
        <div class="empty" id="empty">
          <img src="/icon.svg" alt="" width="54" height="54">
          <h2>Lotus AI</h2>
          <p id="empty-text">Ask anything.</p>
        </div>
      </section>

      <div class="suggest" id="suggest" role="listbox" aria-label="Commands" hidden></div>
      <div class="effort-pop" id="effort-pop" role="group" aria-label="How hard it thinks" hidden></div>
      <form class="composer" id="composer" autocomplete="off">
        <button class="mode" id="mode" type="button" title="Ask first or auto mode (/auto)" hidden>Ask</button>
        <button class="effort" id="effort" type="button" aria-expanded="false" aria-controls="effort-pop" title="How hard it thinks (/effort)" hidden>
          <svg viewBox="0 0 20 14" width="17" height="12" aria-hidden="true"><rect x="0" y="10" width="3" height="4" rx="1"/><rect x="4.25" y="7.5" width="3" height="6.5" rx="1"/><rect x="8.5" y="5" width="3" height="9" rx="1"/><rect x="12.75" y="2.5" width="3" height="11.5" rx="1"/><rect x="17" y="0" width="3" height="14" rx="1"/></svg>
          <span id="effort-name">Thorough</span>
        </button>
        <textarea id="input" rows="1" placeholder="Message Lotus AI – / for commands" aria-label="Message" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" title="Send (Enter)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="stop" id="stop" type="button" aria-label="Stop" title="Stop the answer" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </form>
      <p class="hint" id="hint">Enter sends · Shift+Enter new line · / for commands · Ask/Auto switches the mode</p>
    </main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title">Settings</h2>
        <span class="sheet-saved" id="sheet-saved" aria-live="polite"></span>
        <button class="icon-btn" id="sheet-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
</body>
</html>
