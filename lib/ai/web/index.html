<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="lotus-token" content="{{token}}">
  <meta name="color-scheme" content="dark">
  <title>Lotus AI</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css?v={{version}}">
  <script src="/app.js?v={{version}}" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Conversations">
      <div class="side-head">
        <img src="/icon.svg" alt="" width="22" height="22">
        <span class="brand">Lotus AI</span>
      </div>
      <button class="new" id="new" type="button">New chat</button>
      <nav class="chats" id="chats"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="top">
        <button class="icon-btn menu" id="menu" type="button" aria-label="Conversations">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="top-text">
          <h1 id="title">New chat</h1>
          <p class="meta" id="meta">Connecting …</p>
        </div>
        <button class="icon-btn" id="clear" type="button" aria-label="Clear this conversation" title="Clear this conversation" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div class="banner" id="banner" hidden>
        <span id="banner-text"></span>
        <button type="button" id="banner-retry">Try again</button>
      </div>

      <section class="log" id="log" aria-live="polite">
        <div class="empty" id="empty">
          <img src="/icon.svg" alt="" width="54" height="54">
          <h2>Lotus AI</h2>
          <p id="empty-text">Ask anything.</p>
        </div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message Lotus AI" aria-label="Message" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" title="Send (Enter)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="stop" id="stop" type="button" aria-label="Stop" title="Stop the answer" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </form>
      <p class="hint" id="hint">Enter sends · Shift+Enter new line</p>
    </main>
  </div>
</body>
</html>
